<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cena: administración</title>
<style>
  :root { --bg: #f7f3ee; --card: #fff; --ink: #2a2622; --muted: #6f675f; --line: #e6dfd6; --accent: #8e2a2a; --ok: #2f8f5b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1917; --card: #262320; --ink: #f1ece6; --muted: #a59d94; --line: #3a3631; --accent: #e07a6a; --ok: #5cc98a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; color: var(--accent); }
  .muted { color: var(--muted); font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 16px; }
  input, button { font: inherit; }
  input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  .row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  code { font-size: 1rem; font-weight: 600; }
  .ok { color: var(--ok); font-size: .85rem; }
  .actions { display: flex; gap: 6px; }
  .hidden { display: none; }
  .err { color: #c0392b; min-height: 1.2em; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Administración de la cena</h1>

  <section id="login" class="card">
    <p class="muted">Introduce la clave de administración.</p>
    <form id="loginForm"><input id="keyInput" type="password" autocomplete="current-password"><button style="margin-top:10px">Entrar</button></form>
    <div id="err" class="err"></div>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <p class="muted">Pon un nombre a cada código y pásale a cada persona su enlace por privado. El enlace general sin código es <b id="base"></b>: quien entre ahí tendrá que escribir su código.</p>
      <div id="list"></div>
      <button id="add" style="margin-top:10px">Añadir código</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let key = '';
try { key = sessionStorage.getItem('adminKey') || ''; } catch {}
$('base').textContent = location.origin;

async function api(path, body) {
  const r = body
    ? await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, ...body }) })
    : await fetch(path + '?key=' + encodeURIComponent(key));
  if (!r.ok) throw new Error((await r.json()).error);
  return r.json();
}

function render(list) {
  const box = $('list');
  box.innerHTML = '';
  for (const p of list) {
    const link = `${location.origin}/?c=${p.code}`;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="top"><code></code><span class="ok"></span></div>
      <input placeholder="Nombre de esta persona">
      <div class="actions"><button class="ghost copy">Copiar enlace</button><button class="ghost del">Borrar</button></div>`;
    row.querySelector('code').textContent = p.code;
    row.querySelector('.ok').textContent = p.answered ? `Ha marcado ${p.answered} días` : 'Sin responder';
    const input = row.querySelector('input');
    input.value = p.name;
    input.onchange = async () => { render(await api('/api/admin/name', { code: p.code, name: input.value })); };
    row.querySelector('.copy').onclick = async (e) => {
      try { await navigator.clipboard.writeText(link); e.target.textContent = 'Copiado ✓'; }
      catch { prompt('Copia el enlace:', link); }
    };
    row.querySelector('.del').onclick = async () => {
      if (confirm(`¿Borrar el código ${p.code} y sus respuestas?`)) render(await api('/api/admin/delete', { code: p.code }));
    };
    box.appendChild(row);
  }
}

async function start() {
  try {
    render(await api('/api/admin'));
    try { sessionStorage.setItem('adminKey', key); } catch {}
    $('login').classList.add('hidden');
    $('panel').classList.remove('hidden');
  } catch (e) {
    if (key) $('err').textContent = e.message;
  }
}

$('loginForm').onsubmit = (e) => { e.preventDefault(); key = $('keyInput').value; start(); };
$('add').onclick = async () => render(await api('/api/admin/add', {}));
start();
</script>
</body>
</html>
